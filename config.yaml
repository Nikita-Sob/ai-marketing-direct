# Настройки генератора. Секреты только в env, здесь их нет и не будет.
# Ключи: YANDEX_SEARCH_API_KEY, YANDEX_FOLDER_ID в /root/.hermes/.env

project:
  name: ai-marketing-direct
  template: templates/example_duplex_tgo.xlsx
  output_dir: output

defaults:
  region: "Москва и область"   # имена регионов с листа "Регионы" шаблона
  currency: RUB
  campaign_type: "Единая перфоменс-кампания"
  places: search

wordstat:
  api_key_env: YANDEX_SEARCH_API_KEY
  folder_id_env: YANDEX_FOLDER_ID
  region_id: 225              # Россия
  note: "статистика GetDynamics доступна только до 07.10.2026"

ads:
  # тексты собираются шаблонами и правилами в app/ads.py
  llm_hook_env: ADS_LLM_HOOK   # опционально: URL хука, пусто = без LLM

demo_sites:
  - https://kuppersberg.ru
  - https://duplex-shop.ru
